name: Proposal decision

# Runs when a reviewer labels a proposal issue.
#
#   approved      -> merges the proposal's pull request, which intake opened
#                    and pr-preview.yml previewed — but only once it has
#                    checked that the PR's data file is exactly the SNAPSHOT
#                    taken at intake, applied to main as main is now. If main
#                    has moved or the branch was edited, it rebuilds the PR
#                    and its preview instead and asks for the approval again:
#                    what merges is always what the reviewer was shown.
#   rejected:...  -> records the reason and the fingerprint in
#                    data/decisions.js, closes the issue and its PR.
#
# The reviewer never types a value anywhere in this flow. The only thing this
# workflow will merge is what was proposed and snapshotted.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write   # to start pr-preview, vercel-deploy and publish; see below

concurrency:
  group: bot-push-main
  cancel-in-progress: false

jobs:
  approve:
    # Proposals only: a watch report labelled by mistake is not one.
    if: github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'proposal')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The one rule a person could otherwise walk around. GitHub's own
      # "you cannot approve your own pull request" does not apply here,
      # because the pull request is opened by a workflow, not by the author.
      - name: Refuse a self-approval
        if: github.event.sender.login == github.event.issue.user.login
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body \
            "**Not approved.** @${{ github.event.sender.login }} proposed this, so somebody else has to approve it. The label has been removed."
          gh issue edit "${{ github.event.issue.number }}" --remove-label approved
          exit 1

      - name: Refuse while intake says the proposal is broken
        if: contains(github.event.issue.labels.*.name, 'needs-fixing')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body \
            "**Not approved.** The current version of this proposal could not be read — see the bot's comment above. Fix the issue first; the label has been removed."
          gh issue edit "${{ github.event.issue.number }}" --remove-label approved
          exit 1

      # Written out unchanged, with no approver in it: the pull request was
      # built from exactly this, and the check below rebuilds it to compare.
      # The approver's name goes on the merge commit and the issue instead.
      - name: Take the snapshot recorded at intake
        run: |
          node -e '
            const fs = require("fs");
            const rules = require("./scripts/data-rules.js");
            const got = rules.extractData(fs.readFileSync("data/proposals.js", "utf8"), "LAUNCH_PROPOSALS");
            if (!got.ok) throw new Error("cannot read data/proposals.js");
            const n = Number(process.env.ISSUE_NUMBER);
            const p = got.data.proposals.find((x) => x.issue === n);
            if (!p) { console.error("No recorded proposal for issue #" + n + ". Re-file it, or edit the issue to re-run intake."); process.exit(1); }
            fs.writeFileSync("/tmp/proposal.json", JSON.stringify(p, null, 2));
          '
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}

      - name: Find the pull request that carries it
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          read -r PR SHA < <(gh pr list --head "proposal/$ISSUE_NUMBER" --state open --json number,headRefOid \
            --jq '.[0] // {} | [.number // "", .headRefOid // ""] | @tsv')
          if [ -z "$PR" ]; then
            gh issue comment "$ISSUE_NUMBER" --body \
              "**Not approved.** No open pull request carries this proposal. Rebuild it — Actions → Proposal intake → Run workflow, with this issue's number — then approve again. The label has been removed."
            gh issue edit "$ISSUE_NUMBER" --remove-label approved
            exit 1
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # The reviewer saw the diff and the preview of $SHA. Merge it only if
      # its data file is byte-for-byte the snapshot applied to main as main is
      # NOW, and it touches nothing else. Rebuilt with the date intake stamped,
      # so an approval on a later day still matches.
      - name: Check it is still exactly the proposal, on main as it is now
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR: ${{ steps.pr.outputs.pr }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          git fetch --quiet --depth=1 origin "refs/heads/proposal/$ISSUE_NUMBER"
          if [ "$(git rev-parse FETCH_HEAD)" != "$SHA" ]; then
            echo "The branch moved while this ran."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ON=$(git show "$SHA:data/products.js" | node -e '
            const rules = require("./scripts/data-rules.js");
            let raw = "";
            process.stdin.on("data", (c) => (raw += c)).on("end", () => {
              const got = rules.extractData(raw, "LAUNCH_DATA");
              process.stdout.write(got.ok ? String(got.data.meta.lastUpdated || "") : "");
            });
          ')
          FILES=$(gh pr diff "$PR" --name-only)
          node scripts/proposal-lib.js apply /tmp/proposal.json ${ON:+"$ON"}
          if [ "$FILES" = "data/products.js" ] && git diff --quiet "$SHA" -- data/products.js; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Changed files: $FILES"
            echo "current=false" >> "$GITHUB_OUTPUT"
            git checkout data/products.js
          fi

      - name: Check the whole file, exactly as CI would
        if: steps.verify.outputs.current == 'true'
        run: node scripts/validate-data.js

      # A merge made with GITHUB_TOKEN fires no push workflows, so this starts
      # the two that a push to main would have started. A person merging the
      # pull request by hand starts them the ordinary way.
      - name: Merge it, and rebuild production
        if: steps.verify.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR: ${{ steps.pr.outputs.pr }}
          SHA: ${{ steps.pr.outputs.sha }}
          APPROVER: ${{ github.event.sender.login }}
        run: |
          gh pr merge "$PR" --squash --match-head-commit "$SHA" --delete-branch \
            --subject "Apply proposal #$ISSUE_NUMBER, approved by @$APPROVER" \
            --body "Closes #$ISSUE_NUMBER"
          gh workflow run vercel-deploy.yml --ref main
          gh workflow run publish.yml --ref main
          gh issue comment "$ISSUE_NUMBER" --body \
            "**Approved by @$APPROVER.** #$PR is merged and the production dashboard is being rebuilt from it."
          # By hand: GitHub does not act on "Closes #n" when GITHUB_TOKEN both
          # opened and merged the pull request (seen on #4, 29 Sep).
          gh issue close "$ISSUE_NUMBER" --reason completed

      - name: Main has moved, or the branch was changed — rebuild, and ask again
        if: steps.verify.outputs.current == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          PR=$(bash scripts/proposal-pr.sh "$ISSUE_NUMBER" /tmp/proposal.json | sed -n 's/^pr=//p')
          gh workflow run pr-preview.yml --ref main -f pr="$PR"
          gh issue edit "$ISSUE_NUMBER" --remove-label approved
          gh issue comment "$ISSUE_NUMBER" --body \
            "**Not merged yet.** Since the preview was built, \`main\` has changed underneath #$PR, or the branch itself was edited — so what would merge is no longer what was reviewed. #$PR has been rebuilt from the proposal on today's \`main\`, and its preview is being rebuilt. Check the new preview, then label \`approved\` again."

      # "Approved but not landed" must never look like success.
      - name: Say that nothing was merged
        if: failure() && steps.pr.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body \
            "**Not merged.** The approval stopped before anything landed — see [the run]($RUN). Production is unchanged."

  reject:
    if: startsWith(github.event.label.name, 'rejected') && contains(github.event.issue.labels.*.name, 'proposal')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Record the decision, with the fingerprint that suppresses a repeat
        run: |
          node -e '
            const fs = require("fs");
            const rules = require("./scripts/data-rules.js");
            const read = (f, g) => {
              const raw = fs.readFileSync(f, "utf8");
              const got = rules.extractData(raw, g);
              if (!got.ok) throw new Error("cannot read " + f);
              // Line-start match, as extractData does: proposals.js quotes
              // the assignment in its header comment.
              return { raw, head: raw.slice(0, raw.search(new RegExp("^window\\." + g + "\\s*=", "m"))), data: got.data };
            };
            const n = Number(process.env.ISSUE_NUMBER);
            const props = read("data/proposals.js", "LAUNCH_PROPOSALS");
            const p = props.data.proposals.find((x) => x.issue === n);
            const dec = read("data/decisions.js", "LAUNCH_DECISIONS");
            dec.data.decisions.push({
              issue: n,
              state: "rejected",
              reason: process.env.LABEL,
              by: process.env.DECIDER,
              on: new Date().toISOString().slice(0, 10),
              target: p ? p.target : null,
              proposed: p ? (p.changes || p.now) : null,
              fingerprint: p ? p.fingerprint : null,
            });
            dec.data.meta = { updated: new Date().toISOString().slice(0, 10) };
            fs.writeFileSync("data/decisions.js", dec.head + "window.LAUNCH_DECISIONS =\n" + JSON.stringify({ meta: dec.data.meta, decisions: dec.data.decisions }, null, 2) + "\n");
            props.data.proposals = props.data.proposals.filter((x) => x.issue !== n);
            fs.writeFileSync("data/proposals.js", props.head + "window.LAUNCH_PROPOSALS =\n" + JSON.stringify({ meta: { updated: new Date().toISOString().slice(0, 10) }, proposals: props.data.proposals }, null, 2) + "\n");
          '
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABEL: ${{ github.event.label.name }}
          DECIDER: ${{ github.event.sender.login }}

      # The label name reaches the shell through env only. Anyone who can
      # create labels chooses it, and `${{ }}` inside run: would execute it.
      - name: Commit it, and close the issue and its pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABEL: ${{ github.event.label.name }}
          DECIDER: ${{ github.event.sender.login }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/decisions.js data/proposals.js
          git diff --cached --quiet || git commit -m "Proposal #$ISSUE_NUMBER: rejected ($LABEL)"
          git push
          gh pr close "proposal/$ISSUE_NUMBER" --delete-branch --comment "Rejected on #$ISSUE_NUMBER ($LABEL)." || echo "No open pull request for proposal/$ISSUE_NUMBER."
          gh issue comment "$ISSUE_NUMBER" --body \
            "**Rejected by @$DECIDER — $LABEL.** Nothing was published. The decision and its fingerprint are recorded in \`data/decisions.js\`."
          gh issue close "$ISSUE_NUMBER"
