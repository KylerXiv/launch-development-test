name: Snapshot history and rebuild feed

# Runs only when the data file changes on main. The bot commit it produces
# touches history/, feed.xml and the two generated ontology exports
# (launch-data.jsonld, launch-history.jsonld), which do NOT match this path
# filter, so it cannot retrigger itself.
#
# workflow_dispatch: proposal-decision.yml merges approved proposals with
# GITHUB_TOKEN, which fires no push workflows, so it starts this one by hand
# on main. Re-running it on an unchanged file commits nothing. After such a
# run it starts the translate bot (translate.yml) — see the last step.
on:
  push:
    branches: [main]
    paths: ["data/products.js"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to start translate.yml after an approval

# One bot push at a time — a queued run rebases on the previous one's commit
# instead of failing non-fast-forward.
concurrency:
  group: bot-push-main
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate data
        run: node scripts/validate-data.js
      - name: Snapshot data file into history/
        run: |
          # Parse the JSON body (not a whitespace-sensitive regex) so a legal
          # reformat can't break extraction.
          DATE=$(node -e "
            const raw = require('fs').readFileSync('data/products.js','utf8');
            const m = raw.match(/^window\.LAUNCH_DATA\s*=\s*/m);
            console.log(JSON.parse(raw.slice(m.index + m[0].length).replace(/;?\s*\$/, '')).meta.lastUpdated);
          ")
          mkdir -p history
          TARGET="history/products-$DATE.js"
          # History is append-only: never silently overwrite a prior snapshot.
          # One exception, checked, not assumed: a later change the same day
          # replaces that day's snapshot, so it holds the day's final state —
          # otherwise two approvals on one day fail here.
          if [ -f "$TARGET" ] && ! cmp -s data/products.js "$TARGET"; then
            if WHY=$(node scripts/history-continues.js "$TARGET" data/products.js "$DATE"); then
              echo "Replacing $TARGET: $WHY."
            else
              echo "::error::$TARGET already exists with different content ($WHY)."
              exit 1
            fi
          fi
          cp data/products.js "$TARGET"
          echo "Snapshot: $TARGET"
      - name: Rebuild RSS feed
        run: node scripts/make-feed.js
      - name: Rebuild linked-data export
        run: node scripts/build-ontology.js
      - name: Rebuild temporal history graph
        run: node scripts/build-history-graph.js
      - name: Commit snapshot, feed and linked-data export
        run: |
          git config user.name "launch-dashboard-bot"
          git config user.email "actions@github.com"
          git add history feed.xml ontology/launch-data.jsonld ontology/launch-history.jsonld
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "chore: history snapshot + feed + linked-data rebuild [bot]"
            git push
          fi

      # After an approval, the translate bot as a safety net: the approval job
      # translated already, unless the engine failed there. Started from here,
      # not by the approval job: the group holds one running and one pending
      # run, so dispatched from there alongside this one, it would have been a
      # second pending run and cancelled this one.
      # A push to main starts the bot by itself, so only dispatched runs do this.
      - name: Start the translate bot
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run translate.yml --ref main
