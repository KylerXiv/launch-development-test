name: Proposal intake

# Runs when someone files (or edits) a proposal issue. It reads the form,
# checks the change against the real governance rules with the change applied,
# and answers on the issue.
#
# It also SNAPSHOTS the proposal into data/proposals.js. That snapshot — not
# the issue body — is what an approval later applies, because an issue body
# can be edited by anyone with write access, and "the reviewer cannot change
# the proposal" has to be true rather than merely intended.
#
# And it opens the proposal as a pull request (scripts/proposal-pr.sh), then
# asks pr-preview.yml to build the public dashboard from it, so the reviewer
# sees the diff and the real page before deciding. The pull request is the
# only place data/products.js changes; main is not touched until approval.
#
# workflow_dispatch: source-proposals.yml files proposal issues with
# GITHUB_TOKEN, and those start no workflows, so it starts this one for each.
# Anyone with write access can also use it to rebuild a proposal's PR.

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue:
        description: "Proposal issue number to (re)build"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write   # to dispatch pr-preview.yml — a bot-opened PR triggers nothing by itself

concurrency:
  group: bot-push-main
  cancel-in-progress: false

jobs:
  check:
    # Not on a closed issue: editing a rejected proposal must not reopen its PR.
    # And an edit rebuilds the proposal only when its own author made it —
    # otherwise anyone could rewrite a proposal and then approve it themselves,
    # and nobody could edit one the source watcher filed without that being
    # the only review it got.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.issue.labels.*.name, 'proposal') && github.event.issue.state == 'open' &&
       (github.event.action != 'edited' || github.event.sender.login == github.event.issue.user.login))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Which issue, who filed it, and what it says — from the event when a
      # person filed or edited it, from the API when this run was dispatched.
      # The body goes to a file through env, never into the script: an issue
      # body is untrusted text and `${{ }}` inside run: would execute it.
      - name: Load the issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.issue }}
          NUMBER: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.issue.user.login }}
          BODY: ${{ github.event.issue.body }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            [[ "$INPUT" =~ ^[0-9]+$ ]] || { echo "::error::not an issue number: $INPUT"; exit 1; }
            gh api "repos/$GITHUB_REPOSITORY/issues/$INPUT" > /tmp/issue.json
            jq -e '.state == "open" and .pull_request == null and ([.labels[].name] | index("proposal") != null)' \
              /tmp/issue.json > /dev/null || { echo "::error::#$INPUT is not an open proposal issue"; exit 1; }
            NUMBER="$INPUT"
            AUTHOR=$(jq -r .user.login /tmp/issue.json)
            jq -r '.body // ""' /tmp/issue.json > /tmp/issue-body.md
          else
            printf '%s' "$BODY" > /tmp/issue-body.md
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"

      - name: Read it as a proposal, and check the result
        id: check
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_USER: ${{ steps.issue.outputs.author }}
        run: |
          set +e
          node scripts/proposal-lib.js check /tmp/issue-body.md > /tmp/comment.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          set -e
          node scripts/proposal-lib.js parse /tmp/issue-body.md > /tmp/proposal.json 2>/dev/null || true

      # The proposal applied to main, on proposal/<n>, with an open pull request
      # carrying it. Rebuilt from scratch on every edit. The branch commit is
      # the only place data/products.js changes; this checkout of main is
      # returned to clean.
      - name: Open the proposal as a pull request
        id: pr
        if: steps.check.outputs.status == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: bash scripts/proposal-pr.sh "$ISSUE_NUMBER" /tmp/proposal.json

      # The push above was made with GITHUB_TOKEN, so it fired no workflow.
      - name: Build the public dashboard preview on it
        if: steps.check.outputs.status == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.pr }}
        run: gh workflow run pr-preview.yml --ref main -f pr="$PR"

      - name: Say what it would change, or what is wrong
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          STATUS: ${{ steps.check.outputs.status }}
          PR: ${{ steps.pr.outputs.pr }}
        run: |
          if [ "$STATUS" = "0" ]; then
            {
              echo
              echo "### See it on the page first"
              echo
              echo "The change is applied in #$PR. Its diff is exactly what would change, and a link to the public dashboard with the change in it appears there in a minute or two. Production does not change until this is approved."
            } >> /tmp/comment.md
          fi
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/comment.md

      - name: Name the issue after what it proposes
        if: steps.check.outputs.status == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          TITLE=$(node -e '
            const p = require("/tmp/proposal.json");
            process.stdout.write(require("./scripts/proposal-lib.js").titleFor(p));
          ')
          gh issue edit "$ISSUE_NUMBER" --title "$TITLE"

      - name: Snapshot the proposal, so an approval applies this and not a later edit
        if: steps.check.outputs.status == '0'
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          node -e '
            const fs = require("fs");
            const rules = require("./scripts/data-rules.js");
            const file = "data/proposals.js";
            const raw = fs.readFileSync(file, "utf8");
            // The assignment at a line start, as extractData finds it — the
            // header comment quotes the same text, and a plain indexOf cut
            // the file there and dropped the real assignment.
            const head = raw.slice(0, raw.search(/^window\.LAUNCH_PROPOSALS\s*=/m));
            const got = rules.extractData(raw, "LAUNCH_PROPOSALS");
            if (!got.ok) throw new Error("cannot read " + file);
            const p = JSON.parse(fs.readFileSync("/tmp/proposal.json", "utf8"));
            const list = got.data.proposals.filter((x) => x.issue !== p.issue);
            list.push(p);
            list.sort((a, b) => (a.issue || 0) - (b.issue || 0));
            const out = { meta: { updated: new Date().toISOString().slice(0, 10) }, proposals: list };
            fs.writeFileSync(file, head + "window.LAUNCH_PROPOSALS =\n" + JSON.stringify(out, null, 2) + "\n");
          '
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/proposals.js
          git diff --cached --quiet || git commit -m "Proposal #$ISSUE_NUMBER: recorded, waiting for review"
          git push

      # Last on purpose: source-proposals.yml waits for one of these two labels
      # before starting intake for its next issue.
      - name: Label it waiting, or needing a fix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          STATUS: ${{ steps.check.outputs.status }}
        run: |
          if [ "$STATUS" = "0" ]; then
            gh issue edit "$ISSUE_NUMBER" --add-label waiting --remove-label needs-fixing || true
          else
            gh issue edit "$ISSUE_NUMBER" --add-label needs-fixing --remove-label waiting || true
          fi
