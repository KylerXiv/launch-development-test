name: Validate dashboard data

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate data file
        run: node scripts/validate-data.js
      - name: Validate synthetic dataset
        run: node scripts/validate-data.js data/products.synthetic.js
      - name: Build single-file preview (smoke test)
        run: node scripts/make-preview.js
      # The same build the public site runs: new text stays English, but a
      # translated lookup key or a file the page loads and the build did not
      # write fails here, before it reaches a preview or production.
      - name: French and Portuguese pages build and pass their self-check
        run: node scripts/build-locale-pages.js --allow-stale
      # The file RBM's pages fetch. A change that would break it fails here,
      # before anyone approves it. Builds to a temp file; publishes nothing.
      - name: RBM dashboard.json builds and matches its schema
        run: |
          node scripts/build-dataset.js --allow-stale --out /tmp/dashboard.json
          node scripts/test-build-dataset.js --allow-stale
          node scripts/test-dataset-diff.js
      # The pages handed over to RBM, built from the same page: a change to it
      # that the build no longer understands fails here.
      - name: RBM pages build
        run: |
          node scripts/test-build-rbm-pages.js
          node scripts/build-rbm-pages.js --allow-stale
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SHACL governance shapes (both datasets, fresh projections)
        run: |
          pip install --quiet pyshacl
          node scripts/build-ontology.js data/products.js /tmp/real.jsonld
          node scripts/build-ontology.js data/products.synthetic.js /tmp/synthetic.jsonld
          node scripts/build-history-graph.js /tmp/history.jsonld
          python scripts/check-shapes.py /tmp/real.jsonld /tmp/synthetic.jsonld /tmp/history.jsonld
